name: Build Wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cuda:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            cuda: '12.6.3'
            variant: cu126
          - os: ubuntu-latest
            cuda: '12.8.1'
            variant: cu128
          - os: ubuntu-latest
            cuda: '13.0.2'
            variant: cu130
          - os: ubuntu-latest
            cuda: '13.2.0'
            variant: cu132
          # Windows
          - os: windows-latest
            cuda: '12.6.3'
            variant: cu126
          - os: windows-latest
            cuda: '12.8.1'
            variant: cu128
          - os: windows-latest
            cuda: '13.0.2'
            variant: cu130
          - os: windows-latest
            cuda: '13.2.0'
            variant: cu132

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.variant }} / ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.cuda }}
          method: network

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify nvcc
        run: nvcc --version

      - name: Install build tools
        run: pip install build setuptools wheel numpy

      - name: AOT compile kernels
        run: python -m lpf.kernels.aot.build --all-arch -v

      - name: Build wheel
        run: python -m build --wheel
        env:
          LPF_BUILD_VARIANT: ${{ matrix.variant }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.variant }}-${{ runner.os }}
          path: dist/*.whl

  build-cpu:
    runs-on: ubuntu-latest
    name: cpu / ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build setuptools wheel numpy

      - name: Build CPU wheel
        run: python -m build --wheel
        env:
          LPF_BUILD_VARIANT: cpu

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-cpu-Linux
          path: dist/*.whl

  release:
    needs: [build-cuda, build-cpu]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: true

      - name: List wheels
        run: ls -la wheels/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheels/*.whl
